CONFIG_NETWORKING=y
CONFIG_WIFI=y
CONFIG_NET_LOG=y
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_SENSOR=y
CONFIG_ESPTOOLPY_FLASHSIZE_4MB=y

CONFIG_NET_TCP=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y

CONFIG_MQTT_LIB=y
CONFIG_NET_SOCKETS=y
CONFIG_POLL=y

CONFIG_ENTROPY_GENERATOR=y

CONFIG_MODBUS=y
CONFIG_MODBUS_ROLE_CLIENT=y
CONFIG_MODBUS_RAW_ADU=y
CONFIG_MODBUS_NUMOF_RAW_ADU=1
# Sparkplug B payloads (protobuf, via nanopb module)
CONFIG_NANOPB=y

# SNTP for real UTC timestamps in Sparkplug payloads
CONFIG_SNTP=y
CONFIG_NET_UDP=y
CONFIG_DNS_RESOLVER=y

# SIM7080G cellular modem on UART1 (AT commands, see modem.c / at_parser.c)
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

# Main thread does the sampling loop
CONFIG_MAIN_STACK_SIZE=2048
