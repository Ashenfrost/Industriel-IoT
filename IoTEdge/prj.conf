CONFIG_NETWORKING=y
CONFIG_WIFI=y
CONFIG_NET_LOG=y
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_SENSOR=y
CONFIG_ESPTOOLPY_FLASHSIZE_4MB=y

CONFIG_NET_TCP=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y

CONFIG_MQTT_LIB=y
CONFIG_NET_SOCKETS=y
CONFIG_POLL=y

CONFIG_ENTROPY_GENERATOR=y

# Sparkplug bdSeq kept in flash across reboots (bdseq_store.c, IEC 62443
# CR 3.8). Settings stores named values; NVS is the flash backend. It uses
# the "storage" partition from the espressif-flash-4M layout.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# Unique client ID from the chip's eFuse MAC (client_id.c, CR 3.8)
CONFIG_HWINFO=y

CONFIG_MODBUS=y
CONFIG_MODBUS_ROLE_CLIENT=y
CONFIG_MODBUS_RAW_ADU=y
CONFIG_MODBUS_NUMOF_RAW_ADU=1
# Sparkplug B payloads (protobuf, via nanopb module)
CONFIG_NANOPB=y

# SNTP for real UTC timestamps in Sparkplug payloads
CONFIG_SNTP=y
CONFIG_NET_UDP=y
CONFIG_DNS_RESOLVER=y

# SIM7080G cellular modem on UART1 (AT commands, see modem.c / at_parser.c)
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

# Light sleep between work (power_mgmt.c, APP_LIGHT_SLEEP). The RTC timer
# (enabled in the board overlay) wakes the chip.
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_COUNTER=y

# Main thread does the sampling loop
CONFIG_MAIN_STACK_SIZE=2048
