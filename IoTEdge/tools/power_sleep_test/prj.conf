CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y
CONFIG_GPIO=y
# No CONFIG_LOG: with logging on, Zephyr 4.4's ESP32 PM code needs a 'soc'
# log module that is never registered (link error). printk is used instead.
CONFIG_LOG=n
CONFIG_PRINTK=y
CONFIG_MAIN_STACK_SIZE=4096

# Power management: light sleep when idle, deep sleep via sys_poweroff()
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_POWEROFF=y
CONFIG_COUNTER=y

