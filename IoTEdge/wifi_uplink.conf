# Test build only: MQTT over Wi-Fi with Zephyr's own client instead of the
# SIM7080G (no TLS, so it also needs -DAPP_ALLOW_INSECURE). Use with
#   west build ... -- -DEXTRA_CONF_FILE=wifi_uplink.conf
#     "-DEXTRA_CFLAGS=-DAPP_UPLINK_CELLULAR=0 -DAPP_ALLOW_INSECURE"
CONFIG_MQTT_LIB=y
# UTC over Wi-Fi (the modem does this on the cellular uplink)
CONFIG_SNTP=y
CONFIG_DNS_RESOLVER=y
