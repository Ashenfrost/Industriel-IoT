per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd_file
# Who may publish/subscribe where (IEC 62443 CR 3.8 / CR 2.1)
acl_file /mosquitto/config/acl

# Internal listener for sparkplug-host on the compose network. Not mapped to
# the host in docker-compose.yml, so it can't be reached from the internet
# (IEC 62443 CR 7.7). Login with password_file.
listener 1883

# Edge devices over the internet: TLS 1.2 with a client certificate (mTLS).
# The certificate's CN (device-<mac>) is the MQTT username, so each device
# has its own identity and the ACL binds it to its own topics. Both sides
# are checked against the UCL IoT Group CA (kept offline on Tobias' PC).
listener 8883
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key
tls_version tlsv1.2
require_certificate true
use_identity_as_username true
