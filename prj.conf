CONFIG_NETWORKING=y
CONFIG_WIFI=y
CONFIG_NET_LOG=y
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_SENSOR=y
CONFIG_ESPTOOLPY_FLASHSIZE_4MB=y

CONFIG_NET_TCP=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y

CONFIG_MQTT_LIB=y
CONFIG_NET_SOCKETS=y
CONFIG_POLL=y

CONFIG_ENTROPY_GENERATOR=y

# Sparkplug B payloads (protobuf, via nanopb module)
CONFIG_NANOPB=y

# SNTP for real UTC timestamps in Sparkplug payloads
CONFIG_SNTP=y
CONFIG_NET_UDP=y
CONFIG_DNS_RESOLVER=y

# Main thread does the sampling loop
CONFIG_MAIN_STACK_SIZE=2048
